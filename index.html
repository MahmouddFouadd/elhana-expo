/* ============ ثيم V14 – نفس لغة شكل نظام المخزن ============ */
:root{
  --accent:#F07A2E;--accent-2:#E85A26;
  --paper:#ECECEF;--card:#FFFFFF;--line:#E4E4E8;--line-soft:#F3F3F5;
  --text:#15171C;--mute:#6D707A;
  --brand:#16181D;--on-brand:#FFFFFF;--input:#F6F6F8;--hover:#F3F3F5;
  --hot:#D92D20;--hot-t:rgba(217,45,32,.10);
  --warm:#C77700;--warm-t:rgba(224,138,0,.12);
  --cold:#2E7FD9;--cold-t:rgba(46,127,217,.10);
  --ok:#12976A;--ok-t:rgba(18,151,106,.12);
  --radius:22px;
  --shadow:0 1px 2px rgba(17,19,24,.04),0 10px 30px -16px rgba(17,19,24,.16);
  --shadow-lg:0 2px 6px rgba(17,19,24,.05),0 24px 50px -24px rgba(17,19,24,.3);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1012;--card:#1A1B1F;--line:#2A2B31;--line-soft:#222328;
  --text:#F1F1F3;--mute:#9C9EA8;
  --brand:#F1F1F3;--on-brand:#111215;--input:#222328;--hover:#25262B;
  --hot:#F29A91;--hot-t:rgba(210,80,70,.18);
  --warm:#EDBE62;--warm-t:rgba(214,152,40,.18);
  --cold:#8FBDEB;--cold-t:rgba(64,132,196,.18);
  --ok:#84D4B2;--ok-t:rgba(60,160,120,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 50px -24px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.92em;letter-spacing:.01em}

.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:1.02rem;font-weight:600;line-height:1.25}
.ttl small{display:block;color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
bdi{unicode-bidi:isolate}
.net{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:5px 11px;
  font-size:.8rem;font-weight:600;background:var(--ok-t);color:var(--ok)}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.net.off{background:var(--warm-t);color:var(--warm)}
.net.wait{background:var(--brand);color:var(--on-brand)}
.icon-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;
  border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .moon{display:none}
html[data-theme="dark"] .icon-btn .sun{display:none}
html[data-theme="dark"] .icon-btn .moon{display:block}

.wrap{max-width:720px;margin:0 auto;padding:12px 8px 40px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:12px}

/* ---------- دخول ---------- */
.login{max-width:400px;margin:28px auto;text-align:center;padding:28px 22px}
.login .logo{width:104px;height:104px;margin:0 auto 10px;box-shadow:var(--shadow-lg)}
.panel.login h2{margin:6px 0 2px;font-size:1.25rem;font-weight:600;color:var(--text)}
.login p{margin:0 0 14px;color:var(--mute);font-size:.9rem}
.login label{text-align:start}
.cfg{color:var(--hot);font-weight:600;text-align:center;line-height:1.8}
.cfg code{direction:ltr;unicode-bidi:embed;background:var(--input);padding:1px 6px;border-radius:6px;color:var(--text)}

/* ---------- التبويبات بمؤشر منزلق ---------- */
.seg{position:relative;display:flex;gap:4px;padding:4px;margin:4px 0 12px;background:var(--card);border-radius:999px;box-shadow:var(--shadow)}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;border-radius:999px;padding:10px 8px;font-weight:600;color:var(--mute);transition:color .25s}
.seg button.on{color:var(--on-brand)}
.seg button b{display:inline-block;min-width:24px;margin-inline-start:6px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:.8rem;line-height:1.6}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--brand);
  transition:left .38s cubic-bezier(.3,.7,.2,1),width .38s cubic-bezier(.3,.7,.2,1)}
.view.in{animation:vin .42s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}

/* ---------- النموذج ---------- */
.panel h2{margin:18px 0 2px;font-size:.95rem;font-weight:600;color:var(--mute)}
.panel h2:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}.grid .full{grid-column:1/-1}}
label{display:block;font-weight:500;margin:12px 0 5px;font-size:.9rem}
label .req{color:var(--accent-2)}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid transparent;border-radius:12px;background:var(--input);outline:0;transition:border-color .15s,background .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--text);background:var(--card);box-shadow:0 0 0 3px rgba(120,120,130,.18)}
input.invalid,textarea.invalid{border-color:var(--hot);background:var(--hot-t)}
input[dir="ltr"]{text-align:right}
input[dir="ltr"]:placeholder-shown{text-align:right}
textarea{min-height:76px;resize:vertical}
::placeholder{color:var(--mute);opacity:.75}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;margin:0;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--input);border:1px solid transparent;font-weight:500;cursor:pointer;user-select:none;transition:background .15s,color .15s}
.chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip:has(input:checked){background:var(--brand);color:var(--on-brand)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* درجة الاهتمام: 3 أزرار كبيرة سهلة باللمس */
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prio label{margin:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;
  background:var(--input);border:2px solid transparent;cursor:pointer;font-weight:600;text-align:center;transition:background .15s,border-color .15s}
.prio label small{font-weight:400;font-size:.75rem;color:var(--mute)}
.prio input{position:absolute;opacity:0;pointer-events:none}
.prio .hot:has(input:checked){border-color:var(--hot);background:var(--hot-t);color:var(--hot)}
.prio .warm:has(input:checked){border-color:var(--warm);background:var(--warm-t);color:var(--warm)}
.prio .cold:has(input:checked){border-color:var(--cold);background:var(--cold-t);color:var(--cold)}
.prio label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;
  background:var(--brand);color:var(--on-brand);font-weight:600;transition:transform .1s,opacity .15s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--hover)}
.btn.big{width:100%;padding:15px;font-size:1.05rem;margin-top:18px}
.btn.accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 14px 30px -14px rgba(232,90,38,.65)}
.savebar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}

.editbar{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;padding:10px 14px;border-radius:14px;background:var(--warm-t);color:var(--text);font-size:.92rem}
.editbar span{flex:1;min-width:0}
.who{margin:18px 0 0;color:var(--mute);font-size:.9rem}
.who b{color:var(--text)}
.ued{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;align-items:end}
.ued label{margin:0 0 4px;font-size:.8rem}
@media (max-width:480px){.ued{grid-template-columns:1fr}}
.pill.adm{background:var(--brand);color:var(--on-brand)}.pill.stf{background:var(--input);color:var(--text)}.pill.off{background:var(--hot-t);color:var(--hot)}.pill.you{background:var(--ok-t);color:var(--ok)}
.dupe{margin:10px 0 0;padding:10px 14px;border-radius:14px;background:var(--warm-t);font-size:.9rem}

/* ---------- السجل ---------- */
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:12px 10px;text-align:start;display:flex;flex-direction:column;justify-content:space-between;min-height:92px;transition:transform .2s,box-shadow .2s}
.kpi .v{font-size:1.65rem;font-weight:700;line-height:1.1}
.kpi .l{font-size:.8rem;color:var(--mute)}
.kpi.hero{background:radial-gradient(120% 90% at 85% 10%,rgba(255,255,255,.28),transparent 55%),radial-gradient(90% 80% at 10% 100%,rgba(150,30,10,.25),transparent 60%),linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 14px 30px -14px rgba(232,90,38,.65)}
.kpi.hero .l{color:rgba(255,255,255,.88)}
.kpi.hero .v{font-size:2.1rem}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
button.kpi .v{color:var(--c)}
button.kpi[aria-pressed="true"]{background:var(--t);outline:2px solid var(--c);outline-offset:-2px}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr 1fr}.kpi.hero{grid-column:1/-1;min-height:0;flex-direction:row;align-items:baseline;gap:10px}.kpi.hero .v{order:-1}}

.tools{display:flex;gap:8px;margin-bottom:6px}
.tools input{flex:1;background:var(--card);box-shadow:var(--shadow)}
.tools .btn{flex:none;box-shadow:var(--shadow)}
.info{margin:4px 4px 10px;color:var(--mute);font-size:.85rem;min-height:1.3em}

.lead{position:relative;padding:14px 18px 12px}
.lead::before{content:"";position:absolute;inset-inline-start:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
html[dir="rtl"] .lead::before{border-radius:4px 0 0 4px}
.lead.hot::before{background:var(--hot)}.lead.warm::before{background:var(--warm)}.lead.cold::before{background:var(--cold)}
.lead .hd{display:flex;align-items:flex-start;gap:8px}
.lead h3{flex:1;min-width:0;margin:0;font-size:1.06rem;font-weight:600;overflow-wrap:anywhere}
.lead .sub{color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}
.lead .ph{display:flex;flex-wrap:wrap;gap:2px 14px}
.lead .ph span{direction:ltr;unicode-bidi:isolate}
select.pill{width:auto;flex:none;appearance:none;-webkit-appearance:none;border:0;padding:3px 12px;font-size:.78rem;cursor:pointer;text-align:center}
select.pill:hover{border:0}
select.pill:focus{box-shadow:0 0 0 2px currentColor}
select.pill.hot{background:var(--hot-t)}select.pill.warm{background:var(--warm-t)}select.pill.cold{background:var(--cold-t)}
select.pill option{color:var(--text);background:var(--card)}
.pill{flex:none;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.hot{background:var(--hot-t);color:var(--hot)}.pill.warm{background:var(--warm-t);color:var(--warm)}.pill.cold{background:var(--cold-t);color:var(--cold)}
.pill.pend{background:var(--brand);color:var(--on-brand)}
.pill.bad{background:var(--hot-t);color:var(--hot)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.tag{background:var(--input);border-radius:999px;padding:1px 10px;font-size:.8rem}
.lead .txt{margin:6px 0 0;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lead .note{margin:6px 0 0;padding:8px 12px;border-radius:12px;background:var(--input);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lead .meta{margin-top:8px;color:var(--mute);font-size:.8rem}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:10px}
.acts a,.acts button{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);text-decoration:none;font-size:.85rem;font-weight:500}
.acts a:hover,.acts button:hover{background:var(--hover)}
.acts .del{color:var(--hot)}
.acts .del.arm{background:var(--hot);color:#fff;border-color:var(--hot)}
.empty{text-align:center;color:var(--mute);padding:34px 16px}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}

.msg{margin-top:10px;padding:10px 14px;border-radius:14px;font-weight:500;font-size:.92rem}
.msg.err{background:var(--hot-t);color:var(--hot)}

/* ---------- إشعار ---------- */
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top,0px));z-index:50;transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  max-width:min(92vw,460px);padding:11px 18px;border-radius:14px;background:#16181D;color:#F1F1F3;font-weight:500;box-shadow:var(--shadow-lg);transition:opacity .2s,transform .25s}
html[data-theme="dark"] .toast{background:#F1F1F3;color:#111215}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--hot)!important;color:#fff!important}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- أدوات ---------- */
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=b[6]&15|64;b[8]=b[8]&63|128;

function digits(s){return String(s||"").replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return"۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/\D/g,"")}

function waNumber(s){
  var raw=String(s||"").trim(),d=digits(raw);if(!d)return "";

}

function card(r){

  if(r._pending)hd.appendChild(el("span","pill "+(r._err?"bad":"pend"),r._err?"ما اترفعش":"منتظر الرفع"));

  var nm=$("u_name").value.trim(),un=$("u_user").value.trim().toLowerCase(),pw=$("u_pw").value,role=$("u_role").value;
  [].forEach.call(document.querySelectorAll("#ufrm .invalid"),function(x){x.classList.remove("invalid")});
  function no(id,t){$(id).classList.add("invalid");$(id).focus();toast(t,true)}
  if(!nm)return no("u_name","اكتب الاسم اللي هيظهر في السجل");
  if(!un)return no("u_user","اكتب اسم المستخدم");
  if(un.indexOf("@")<0&&!/^[a-z0-9._-]{3,30}$/.test(un))return no("u_user","اسم المستخدم: حروف إنجليزي وأرقام و . _ - من 3 لـ 30");
  if(pw.length<6)return no("u_pw",FNERR.weak_password);
  var b=$("u_add");b.disabled=true;b.textContent="بيضيف…";
  adminCall({action:"create",display_name:nm,email:toEmail(un),password:pw,role:role}).then(function(){
    toast("✅ اتضاف "+nm+" – يدخل بـ "+un);$("u_name").value="";$("u_user").value="";$("u_pw").value="";$("u_role").value="staff";loadTeam();
  },function(e){toast(e.message,true)}).then(function(){b.disabled=false;b.textContent="إضافة المستخدم"});
});
})();

/* ---------- يشتغل من غير نت بعد أول فتحة ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
}
</script>
