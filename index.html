<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A353E">
<title>زوار المعرض – الهنا إليكتريك</title>
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="زوار المعرض">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* الوضع الغامق هو الافتراضي – ويتحدد قبل الرسم عشان الشاشة ماتومضش */
(function(){var t=null;try{t=localStorage.getItem("expo.theme")}catch(e){}
if(t!=="dark"&&t!=="light")t="dark";
document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
/* ============ ثيم «Trip Plan» – كروت غامقة على خلفية رمادي مزرق ============ */
:root{
  --accent:#FF8A3D;--accent-2:#EE5F2C;
  --paper:#DFE5EA;--bg-a:#EEF2F5;--bg-b:#D3DBE2;
  --card:#FFFFFF;--line:#D9DFE5;--line-soft:#EDF0F3;
  --text:#14181D;--mute:#66707A;
  --brand:#1B2026;--on-brand:#FFFFFF;--input:#EEF1F4;--hover:#F1F4F6;
  --hot:#DA4E24;--hot-t:rgba(226,85,42,.12);
  --warm:#0F9467;--warm-t:rgba(19,155,110,.12);
  --cold:#7446DB;--cold-t:rgba(122,75,224,.11);
  --ok:#0F9467;--ok-t:rgba(19,155,110,.12);
  --n-hot:#FF9152;--n-hot2:#E8452C;
  --n-warm:#45E0A4;--n-warm2:#0FA170;
  --n-cold:#BC97FF;--n-cold2:#7646E6;
  --dock:#FFFFFF;--glass:rgba(255,255,255,.74);--edge:rgba(20,24,29,.05);--dot:rgba(255,255,255,.95);
  --in-shadow:inset 0 1px 2px rgba(20,24,29,.06);
  --radius:26px;
  --shadow:0 1px 2px rgba(20,24,29,.04),0 14px 34px -20px rgba(30,40,52,.28);
  --shadow-lg:0 2px 6px rgba(20,24,29,.05),0 26px 50px -24px rgba(30,40,52,.38);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --paper:#26313A;--bg-a:#4B5B67;--bg-b:#1A2127;
  --card:#1C2126;--line:#343C44;--line-soft:#2A3138;
  --text:#EEF1F4;--mute:#8F99A3;
  --brand:#EEF1F4;--on-brand:#15191D;--input:#252B32;--hover:#2A3138;
  --hot:#FF9A6E;--hot-t:rgba(255,122,69,.16);
  --warm:#62E2B2;--warm-t:rgba(47,201,143,.15);
  --cold:#C6A8FF;--cold-t:rgba(155,107,255,.17);
  --ok:#62E2B2;--ok-t:rgba(47,201,143,.15);
  --dock:#191D22;--glass:rgba(27,32,37,.74);--edge:rgba(255,255,255,.06);--dot:rgba(225,236,244,.30);
  --in-shadow:inset 0 2px 5px rgba(0,0,0,.28);
  --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 40px -22px rgba(0,0,0,.8);
  --shadow-lg:inset 0 1px 0 rgba(255,255,255,.05),0 28px 56px -24px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:transparent;color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.92em;letter-spacing:.01em}

/* ---------- الخلفية: تدرّج رمادي مزرق ونقط ضوء ناعمة ---------- */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
background:
  radial-gradient(22px 22px at 86% 13%,var(--dot),transparent),
  radial-gradient(14px 14px at 40% 18%,var(--dot),transparent),
  radial-gradient(10px 10px at 66% 23%,var(--dot),transparent),
  radial-gradient(8px 8px at 90% 34%,var(--dot),transparent),
  radial-gradient(18px 18px at 12% 76%,var(--dot),transparent),
  radial-gradient(16px 16px at 86% 78%,var(--dot),transparent),
  radial-gradient(9px 9px at 38% 82%,var(--dot),transparent),
  radial-gradient(120% 60% at 75% 0%,var(--bg-a),transparent 70%),
  linear-gradient(180deg,var(--bg-a),var(--paper) 45%,var(--bg-b))}

/* ---------- الشريط العلوي ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-width:720px;margin:8px auto 0;
display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;
background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow)}
@media (max-width:740px){.topbar{margin-inline:8px}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-a)}
.logo{display:block;flex:none;width:44px;height:44px;border-radius:50%;background:#fff url("./icon-192.png") center/cover no-repeat;box-shadow:0 0 0 2px var(--edge)}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:1.02rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
bdi{unicode-bidi:isolate}
.net{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:5px 11px;
font-size:.8rem;font-weight:600;background:var(--ok-t);color:var(--ok)}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.net.off{background:var(--hot-t);color:var(--hot)}
.net.wait{background:var(--brand);color:var(--on-brand)}
.icon-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;
border:1px solid var(--edge);border-radius:999px;background:var(--input);color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .moon{display:none}
html[data-theme="dark"] .icon-btn .sun{display:none}
html[data-theme="dark"] .icon-btn .moon{display:block}

.wrap{max-width:720px;margin:0 auto;padding:14px 10px calc(130px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:12px}

/* ---------- دخول ---------- */
.login{max-width:400px;margin:28px auto;text-align:center;padding:28px 22px}
.login .logo{width:104px;height:104px;margin:0 auto 10px;box-shadow:var(--shadow-lg)}
.panel.login h2{margin:6px 0 2px;font-size:1.25rem;font-weight:600;color:var(--text)}
.login p{margin:0 0 14px;color:var(--mute);font-size:.9rem}
.login label{text-align:start}
.cfg{color:var(--hot);font-weight:600;text-align:center;line-height:1.8}
.cfg code{direction:ltr;unicode-bidi:embed;background:var(--input);padding:1px 6px;border-radius:6px;color:var(--text)}

/* ---------- البار السفلي بزرار عائم في النص ---------- */
.dock{position:fixed;z-index:30;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0 auto;
width:calc(100% - 20px);max-width:440px;height:70px;padding:0 6px;
display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;
background:var(--dock);border:1px solid var(--edge);border-radius:30px;box-shadow:0 22px 44px -18px rgba(0,0,0,.55)}
.dock .tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:center;
border:0;background:none;padding:0 4px;color:var(--mute);font-size:.78rem;font-weight:600;transition:color .25s}
.dock .tab.on{color:var(--text)}
.dock svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock .tab b{position:absolute;top:9px;inset-inline-end:calc(50% - 30px);min-width:20px;padding:0 6px;border-radius:999px;
background:var(--accent);color:#fff;font-size:.7rem;line-height:1.6;box-shadow:0 0 0 3px var(--dock)}
.dock #tabTeam.hide{display:flex!important;visibility:hidden}
.dock .fab{position:relative;z-index:2;justify-self:center;align-self:start;margin-top:-26px;width:64px;height:64px;border:0;border-radius:50%;
display:grid;place-items:center;color:#fff;
background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.38),transparent 52%),linear-gradient(140deg,var(--accent),var(--accent-2));
box-shadow:0 0 0 7px var(--dock),0 18px 30px -8px rgba(238,95,44,.75);transition:transform .15s}
.dock .fab svg{width:28px;height:28px;stroke-width:2.2}
.dock .fab:active{transform:scale(.93)}
.dock .fab span{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.74rem;font-weight:600;color:var(--mute)}
.dock .fab.on span{color:var(--text)}
.dock .ind{position:absolute;top:-1px;left:0;width:0;height:3px;pointer-events:none;
transition:left .38s cubic-bezier(.3,.7,.2,1),width .38s cubic-bezier(.3,.7,.2,1),opacity .2s}
.dock .ind::after{content:"";display:block;width:26px;height:3px;margin:0 auto;border-radius:0 0 4px 4px;background:var(--accent);box-shadow:0 2px 12px var(--accent)}
.dock:has(.fab.on) .ind{opacity:0}
.view.in{animation:vin .42s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}

/* ---------- النموذج ---------- */
.panel h2{margin:18px 0 2px;font-size:.95rem;font-weight:600;color:var(--mute)}
.panel h2:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}.grid .full{grid-column:1/-1}}
label{display:block;font-weight:500;margin:12px 0 5px;font-size:.9rem}
label .req{color:var(--accent-2)}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:14px;background:var(--input);box-shadow:var(--in-shadow);outline:0;transition:border-color .15s,background .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(255,138,61,.2)}
input.invalid,textarea.invalid{border-color:var(--hot);background:var(--hot-t)}
input[dir="ltr"]{text-align:right}
input[dir="ltr"]:placeholder-shown{text-align:right}
textarea{min-height:76px;resize:vertical}
::placeholder{color:var(--mute);opacity:.75}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;margin:0;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;
background:var(--input);box-shadow:var(--in-shadow);border:1px solid transparent;font-weight:500;cursor:pointer;user-select:none;transition:background .15s,color .15s}
.chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip:has(input:checked){background:var(--brand);color:var(--on-brand);box-shadow:none}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* درجة الاهتمام: 3 أزرار كبيرة سهلة باللمس */
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prio label{margin:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:18px;
background:var(--input);box-shadow:var(--in-shadow);border:2px solid transparent;cursor:pointer;font-weight:600;text-align:center;transition:background .15s,border-color .15s}
.prio label small{font-weight:400;font-size:.75rem;color:var(--mute)}
.prio input{position:absolute;opacity:0;pointer-events:none}
.prio .hot:has(input:checked){border-color:var(--hot);background:var(--hot-t);color:var(--hot)}
.prio .warm:has(input:checked){border-color:var(--warm);background:var(--warm-t);color:var(--warm)}
.prio .cold:has(input:checked){border-color:var(--cold);background:var(--cold-t);color:var(--cold)}
.prio label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;
background:var(--brand);color:var(--on-brand);font-weight:600;transition:transform .1s,opacity .15s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--edge)}
.btn.ghost:hover{background:var(--hover)}
.btn.big{width:100%;padding:15px;font-size:1.05rem;margin-top:18px}
.btn.accent{background:radial-gradient(circle at 25% 0%,rgba(255,255,255,.25),transparent 55%),linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 14px 30px -14px rgba(238,95,44,.75)}
.savebar{position:sticky;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:5}

.editbar{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;padding:10px 14px;border-radius:16px;background:var(--hot-t);color:var(--text);font-size:.92rem}
.editbar span{flex:1;min-width:0}
.who{margin:18px 0 0;color:var(--mute);font-size:.9rem}
.who b{color:var(--text)}
.ued{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;align-items:end}
.ued label{margin:0 0 4px;font-size:.8rem}
@media (max-width:480px){.ued{grid-template-columns:1fr}}
.pill.adm{background:var(--brand);color:var(--on-brand)}.pill.stf{background:var(--input);color:var(--text)}.pill.off{background:var(--hot-t);color:var(--hot)}.pill.you{background:var(--ok-t);color:var(--ok)}
.dupe{margin:10px 0 0;padding:10px 14px;border-radius:16px;background:var(--hot-t);font-size:.9rem}

/* ---------- السجل ---------- */
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--edge);border-radius:22px;background:var(--card);box-shadow:var(--shadow);padding:12px 10px;text-align:start;display:flex;flex-direction:column;justify-content:space-between;min-height:92px;transition:transform .2s,box-shadow .2s}
.kpi .v{font-size:1.65rem;font-weight:700;line-height:1.1}
.kpi .l{font-size:.8rem;color:var(--mute)}
.kpi.hero{border:0;background:radial-gradient(120% 90% at 85% 10%,rgba(255,255,255,.3),transparent 55%),radial-gradient(90% 80% at 10% 100%,rgba(150,30,10,.25),transparent 60%),linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 14px 30px -14px rgba(238,95,44,.7)}
.kpi.hero .l{color:rgba(255,255,255,.9)}
.kpi.hero .v{font-size:2.1rem}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
button.kpi .v{color:var(--c)}
button.kpi[aria-pressed="true"]{background:var(--t);outline:2px solid var(--c);outline-offset:-2px}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr 1fr}.kpi.hero{grid-column:1/-1;min-height:0;flex-direction:row;align-items:baseline;gap:10px}.kpi.hero .v{order:-1}}

.tools{display:flex;gap:8px;margin-bottom:6px}
.tools input{flex:1;background:var(--card);border-color:var(--edge);box-shadow:var(--shadow)}
.tools .btn{flex:none;box-shadow:var(--shadow)}
.info{margin:4px 4px 10px;color:var(--mute);font-size:.85rem;min-height:1.3em}
.info:empty{min-height:0;margin:0 0 8px}

/* أيام المعرض – زي Day 1 / Day 2 */
.days{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;margin:4px 0 0;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:88px;padding:9px 14px;border:1px solid var(--edge);border-radius:18px;
background:var(--card);box-shadow:var(--shadow);color:var(--text);text-align:start;scroll-snap-align:start;transition:background .2s,color .2s}
.day b{font-size:.92rem;font-weight:600}
.day small{font-size:.74rem;color:var(--mute);white-space:nowrap}
.day.on{background:var(--brand);color:var(--on-brand);border-color:transparent}
.day.on small{color:inherit;opacity:.72}

.lead{position:relative;padding:14px 18px 12px}
.lead::before{content:"";position:absolute;inset-inline-start:0;top:18px;bottom:18px;width:4px;border-radius:4px 0 0 4px;background:var(--line)}
.lead.hot::before{background:var(--hot)}.lead.warm::before{background:var(--warm)}.lead.cold::before{background:var(--cold)}
.lead .hd{display:flex;align-items:flex-start;gap:8px}
.lead h3{flex:1;min-width:0;margin:0;font-size:1.06rem;font-weight:600;overflow-wrap:anywhere}
.lead .sub{color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}
.lead .ph{display:flex;flex-wrap:wrap;gap:2px 14px}
.lead .ph span{direction:ltr;unicode-bidi:isolate}

/* السجل كـ Timeline: خط متقطع ونقطة ملونة لكل زائر حسب درجة الاهتمام */
#list{position:relative;padding-inline-start:52px}
#list::before{content:"";position:absolute;inset-inline-start:21px;top:26px;bottom:30px;border-inline-start:2px dashed var(--line)}
#list:has(> .empty){padding-inline-start:0}
#list:has(> .empty)::before{display:none}
#list .lead{--nc:#8F99A3;--nc2:#5D6772;margin-bottom:14px}
#list .lead.hot{--nc:var(--n-hot);--nc2:var(--n-hot2)}
#list .lead.warm{--nc:var(--n-warm);--nc2:var(--n-warm2)}
#list .lead.cold{--nc:var(--n-cold);--nc2:var(--n-cold2)}
#list .lead::before{content:"•";inset-inline-start:-50px;top:12px;bottom:auto;width:40px;height:40px;border-radius:50%;
display:grid;place-items:center;font-size:17px;line-height:1;color:#fff;
background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),transparent 48%),linear-gradient(140deg,var(--nc),var(--nc2));
box-shadow:0 0 0 5px var(--paper),0 10px 24px -6px var(--nc)}
#list .lead.hot::before{content:"🔥"}
#list .lead.warm::before{content:"🌤"}
#list .lead.cold::before{content:"❄️"}
#list .lead::after{content:"";position:absolute;inset-inline-start:-11px;top:31px;width:11px;height:2px;border-radius:2px;background:var(--nc)}

select.pill{width:auto;flex:none;appearance:none;-webkit-appearance:none;border:0;box-shadow:none;padding:3px 12px;font-size:.78rem;cursor:pointer;text-align:center}
select.pill:hover{border:0}
select.pill:focus{box-shadow:0 0 0 2px currentColor}
select.pill.hot{background:var(--hot-t)}select.pill.warm{background:var(--warm-t)}select.pill.cold{background:var(--cold-t)}
select.pill option{color:var(--text);background:var(--card)}
.pill{flex:none;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.hot{background:var(--hot-t);color:var(--hot)}.pill.warm{background:var(--warm-t);color:var(--warm)}.pill.cold{background:var(--cold-t);color:var(--cold)}
.pill.pend{background:var(--brand);color:var(--on-brand)}
.pill.bad{background:var(--hot-t);color:var(--hot)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.tag{background:var(--input);border-radius:999px;padding:1px 10px;font-size:.8rem}
.lead .txt{margin:6px 0 0;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lead .note{margin:6px 0 0;padding:8px 12px;border-radius:14px;background:var(--input);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lead .meta{margin-top:8px;color:var(--mute);font-size:.8rem}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:10px}

  flushing=true;var done=0,i=0;

      if(isNetErr(r.error)){flushing=false;finish();return}

    ed.onclick=function(){pane.classList.toggle("hide");if(!pane.classList.contains("hide"))i1.focus()};
    box.appendChild(d);
  });
}
function upd(body,okMsg,btn){
  body.action="update";if(btn)btn.disabled=true;
  adminCall(body).then(function(){
    toast(okMsg);
    if(me&&body.id===me.id&&body.display_name){me.display_name=body.display_name;lsSet(K_ME,me);applyMe()}
    loadTeam();
  },function(e){toast(e.message,true);if(btn)btn.disabled=false});
}
["u_name","u_user","u_pw"].forEach(function(i){$(i).addEventListener("input",function(){this.classList.remove("invalid")})});
$("ufrm").addEventListener("submit",function(ev){
  ev.preventDefault();
  var nm=$("u_name").value.trim(),un=$("u_user").value.trim().toLowerCase(),pw=$("u_pw").value,role=$("u_role").value;
  [].forEach.call(document.querySelectorAll("#ufrm .invalid"),function(x){x.classList.remove("invalid")});
  function no(id,t){$(id).classList.add("invalid");$(id).focus();toast(t,true)}
  if(!nm)return no("u_name","اكتب الاسم اللي هيظهر في السجل");
  if(!un)return no("u_user","اكتب اسم المستخدم");
  if(un.indexOf("@")<0&&!/^[a-z0-9._-]{3,30}$/.test(un))return no("u_user","اسم المستخدم: حروف إنجليزي وأرقام و . _ - من 3 لـ 30");
  if(pw.length<6)return no("u_pw",FNERR.weak_password);
  var b=$("u_add");b.disabled=true;b.textContent="بيضيف…";
  adminCall({action:"create",display_name:nm,email:toEmail(un),password:pw,role:role}).then(function(){
    toast("✅ اتضاف "+nm+" – يدخل بـ "+un);$("u_name").value="";$("u_user").value="";$("u_pw").value="";$("u_role").value="staff";loadTeam();
  },function(e){toast(e.message,true)}).then(function(){b.disabled=false;b.textContent="إضافة المستخدم"});
});
})();
